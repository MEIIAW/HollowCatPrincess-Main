 <footer class="ftr-container">
  
    <div class="main-menu">
          <button class="page-btn active" onclick="switchTab('home', this)">Home</button><br>
          <button class="page-btn" onclick="switchTab('common', this)">2</button><br>
          <button class="page-btn" onclick="switchTab('spins', this)">3</button><br>
          <button class="page-btn" onclick="switchTab('openers', this)">4</button><br>
          <button class="page-btn" onclick="switchTab('advanced', this)">5</button><br>

          <h3 id="tachyon">hoover</h3>
      </div>
   </footer>
<script>
    function switchTab(tabId, clickedBtn) {
      const allContents = document.querySelectorAll('.page');
      allContents.forEach(content => {
        content.classList.remove('active');
        });
      
      const allButtons = document.querySelectorAll('.page-btn');
      allButtons.forEach(btn => {
        btn.classList.remove('active');
        });
      
      document.getElementById(tabId).classList.add('active');
      clickedBtn.classList.add('active');
      }
  </script>
</body>
