<!DOCTYPE=html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="img/favicon.png"> 
<link rel="stylesheet" href="mybs.css">
<title>All Of Tetrio</title>
</head>
<body>
<div id="meow">
  <div id="home" class="page active">
      <h1>I was tired of not being able to find anything quickly unless i knew the exact name of what i was searching for on sites like four.lol and harddrop wiki, so I'm making this as an alternative</h1>
    </div>
  <div id="rotations_and_spins" class="page">
      spins
    </div>
  <div id="openers" class="page">
      openers
    </div>
  <div id="setups" class="page">
      setups
    </div>
  <div id="common_situations_solves" class="page">
      meow
    </div>
  <div id="credits" class="page">
      credits
      </div>
 <footer class="ftr-container">
  </footer>
  </div>
    <div class="main-menu">
    
          <button class="page-btn active" onclick="switchTab('home', this)">Home</button><br><br>
          <button class="page-btn" onclick="switchTab('rotations_and_spins', this)">Rotations and Spins</button><br><br>
          <button class="page-btn" onclick="switchTab('openers', this)">Openers</button><br><br>
          <button class="page-btn" onclick="switchTab('setups', this)">Setups</button><br><br>
          <button class="page-btn" onclick="switchTab('common_situations_solves', this)">Common Situations Solves</button><br><br>
          <button class="page-btn" onclick="switchTab('credits', this)">Credits</button>
          <h3 id="tachyon"><img id="tachyon" src="img/tachyon.png"></h3>
      </div>

<script>
// .toggle active
    document.querySelectorAll('.toggle').forEach(
      box => {
        box.addEventListener('click',(e) => {
          e.stopPropagation();
          
        box.classList.toggle('active');
        });
        });

// main pages toggle
    function switchTab(tabId, clickedBtn) {
      const allContents = document.querySelectorAll('.page');
      allContents.forEach(content => {
        content.classList.remove('active');
        });
      
      const allButtons = document.querySelectorAll('.page-btn');
      allButtons.forEach(btn => {
        btn.classList.remove('active');
        });
      
      document.getElementById(tabId).classList.add('active');
      clickedBtn.classList.add('active');
      }
  </script>
</body>
</html>
